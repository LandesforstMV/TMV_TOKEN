name: Update TMV Events

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch data from TMV ContentHub
        run: |
          curl --request POST \
            --url https://contenthub.tmv.de/api/v4/endpoints/746971a3-49fd-4e83-af9e-15a64b9991c3 \
            --header 'Authorization: Bearer ${{ secrets.TMV_TOKEN }}' \
            --header 'Content-Type: application/json' \
            -o events.json

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add events.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Update events data" && git push)
