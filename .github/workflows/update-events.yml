name: Update Events JSON

on:
  schedule:
    - cron: '0 */2 * * *' # Läuft alle 2 Stunden (zur vollen Stunde)
  workflow_dispatch: # Ermöglicht den manuellen Start über den GitHub-Tab "Actions"

jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Daten von TMV ContentHub abrufen, anreichern und speichern
        env:
          TMV_TOKEN: ${{ secrets.TMV_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("TMV_TOKEN")
          if not token:
              print("Fehler: Das Secret TMV_TOKEN fehlt (GitHub: Settings > Secrets and variables > Actions).")
              sys.exit(1)

          base_url = "https://contenthub.tmv.de/api/v4/endpoints/746971a3-49fd-4e83-af9e-15a64b9991c3"
          base_universal = "https://contenthub.tmv.de/api/v4/universal/"
          # Liefert referenzierte Knoten (inkl. dc:additionalInformation = Kurz-/Langbeschreibung) inline aus
          include_params = "fields=*&include=image,image.author,eventSchedule,location,dc:additionalInformation,dc:classification"
          PAGE_SIZE = 100

          payload = {
              "filter": {
                  "classifications": {
                      "in": {
                          "withSubtree": ["814b38bc-c0af-455b-af47-a0e894eff1af"]
                      }
                  }
              }
          }

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json"
          }

          def page_url(n):
              return f"{base_url}?{include_params}&page%5Bsize%5D={PAGE_SIZE}&page%5Bnumber%5D={n}"

          def post(url):
              req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers=headers, method="POST")
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          def is_event(node):
              types = node.get("@type", [])
              if not isinstance(types, list):
                  types = [types]
              return "Event" in types

          try:
              # --- Alle Seiten der Schnittstelle abrufen ---
              try:
                  parsed = post(page_url(1))
              except urllib.error.HTTPError as e:
                  print(f"Hinweis: Abruf mit Seitenparametern abgelehnt (HTTP {e.code}), versuche es ohne.")
                  parsed = post(f"{base_url}?{include_params}")

              first = parsed
              graph = list(first.get("@graph", []))
              existing_ids = {node.get("@id") for node in graph if "@id" in node}
              meta = first.get("meta") or {}
              total = meta.get("total")
              total_pages = int(meta.get("pages") or 1)
              print(f"Seite 1: {len(graph)} Knoten (API: {total} Veranstaltungen auf {total_pages} Seite(n))")

              page = 1
              while page < total_pages:
                  page += 1
                  nxt = (parsed.get("links") or {}).get("next")
                  if nxt:
                      url = nxt if nxt.startswith("http") else urllib.parse.urljoin(base_url, nxt)
                  else:
                      url = page_url(page)
                  parsed = post(url)
                  added = 0
                  for node in parsed.get("@graph", []):
                      node_id = node.get("@id")
                      if node_id not in existing_ids:
                          graph.append(node)
                          existing_ids.add(node_id)
                          added += 1
                  print(f"Seite {page}: {added} neue Knoten")

              event_count = sum(1 for node in graph if is_event(node))
              print(f"Veranstaltungen insgesamt: {event_count}")
              if isinstance(total, int) and event_count < total:
                  print(f"Fehler: Die API meldet {total} Veranstaltungen, geladen wurden aber nur {event_count}. events.json wird nicht überschrieben.")
                  sys.exit(1)

              # --- Alle referenzierten Knoten-IDs einsammeln. Die meisten kommen
              #     per include=... bereits inline mit; der Nachlade-Loop unten
              #     fängt alles ab, was trotzdem fehlt (z. B. organizer) ---
              ref_ids = set()
              for item in graph:
                  for field in ("location", "organizer", "image", "dc:additionalInformation"):
                      refs = item.get(field, [])
                      if isinstance(refs, dict):
                          refs = [refs]
                      elif not isinstance(refs, list):
                          refs = []
                      for ref in refs:
                          ref_id = ref.get("@id") if isinstance(ref, dict) else (ref if isinstance(ref, str) else None)
                          if ref_id and ref_id not in existing_ids:
                              ref_ids.add(ref_id)

              # --- Fehlende Knoten (Spielstätten/Organisatoren/Infotexte) einzeln nachladen und einbetten ---
              for ref_id in ref_ids:
                  detail_url = ref_id if ref_id.startswith("http") else f"{base_universal}{ref_id}"
                  try:
                      detail_req = urllib.request.Request(detail_url, headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
                      with urllib.request.urlopen(detail_req, timeout=60) as det_res:
                          det_data = json.loads(det_res.read().decode("utf-8"))
                          if "@graph" in det_data:
                              for sub_node in det_data["@graph"]:
                                  if sub_node.get("@id") not in existing_ids:
                                      graph.append(sub_node)
                                      existing_ids.add(sub_node.get("@id"))
                          else:
                              if det_data.get("@id") and det_data.get("@id") not in existing_ids:
                                  graph.append(det_data)
                                  existing_ids.add(det_data.get("@id"))
                  except Exception as sub_e:
                      print(f"Konnte Referenz {ref_id} nicht laden: {sub_e}")

              first["@graph"] = graph

              with open("events.json", "w", encoding="utf-8") as f:
                  json.dump(first, f, ensure_ascii=False, indent=2)

              print(f"Erfolgreich aktualisiert. Veranstaltungen: {event_count}, Gesamt-Knoten im Graph: {len(graph)}")
          except Exception as e:
              print(f"Fehler beim Abrufen der Schnittstelle: {e}")
              sys.exit(1)
          PY

      - name: Änderungen in GitHub speichern (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || git commit -m "Automatischer Event-Export mit eingebetteten Spielstätten aktualisiert"
          git push
